# Reference: https://qlty.sh/d/qlty-toml
#
# Code-quality configuration for both the Qlty CLI and Qlty Cloud. Lint and
# format rules come from the shared sinemacula/coding-standards source; this
# file wires that source in and selects the plugins relevant to this
# repository.
config_version = "0"

exclude_patterns = [
    "*_min.*",
    "*-min.*",
    "*.min.*",
    "**/build/**",
    "**/cache/**",
    "**/coverage/**",
    "**/dist/**",
    "**/node_modules/**",
    "**/vendor/**",
    ".claude/**",
    ".qlty/configs/**",
    ".sinemacula/**",
    "SineMaculaLaravel/Tests/**/*.inc",
]

test_patterns = [
    "**/test/**",
    "**/spec/**",
    # This repo follows PHPUnit's PascalCase convention (SineMaculaLaravel/Tests, *Test.php),
    # which the default lowercase patterns below do not match; without these, qlty
    # treats the sniff tests as source and reports their boilerplate as duplication.
    "**/Tests/**",
    "**/*Test.php",
    "**/*.test.*",
    "**/*.spec.*",
    "**/*_test.*",
    "**/*_spec.*",
    "**/test_*.*",
    "**/spec_*.*",
]

[[source]]
name = "default"
default = true

[[source]]
name = "sinemacula"
repository = "https://github.com/sinemacula/coding-standards"
tag = "v1.30.0"

[[plugin]]
name = "ripgrep"
mode = "comment"

# Dogfood the SineMacula PHP standards on this repo's own code. phpcs and php-cs-fixer
# read the in-tree configs under .qlty/configs (phpcs.xml, .php-cs-fixer.dist.php). The
# shared standard plus slevomat + the installer come from composer.json so the ruleset's
# sniffs resolve in qlty's sandbox.
[[plugin]]
name = "php-codesniffer"
package_file = "composer.json"
package_filters = ["slevomat", "dealerdirect", "sinemacula"]

# The in-tree fixer config builds on the base PhpCsFixerConfig, so the standards package
# is installed into the sandbox directly. It cannot come from package_file: setting that
# key makes qlty ignore extra_packages.
[[plugin]]
name = "php-cs-fixer"
extra_packages = ["sinemacula/coding-standards@1.30.0"]

# phpstan runs in GitHub Actions instead (phpstan.neon.dist): qlty Cloud never runs
# `composer install`, so it cannot autoload the in-repo PHPStan rules or scan
# PHP_CodeSniffer's non-PSR-4 source that the sniff code depends on. The shared
# source enables phpstan for every consumer, so it is turned off here.
[[plugin]]
name = "phpstan"
mode = "disabled"

# php/ holds shipped tool configs, not source, so the PHP plugins skip it - they
# target src/ and SineMaculaLaravel (Sniffs + Tests).
[[exclude]]
plugins = ["php-codesniffer", "php-cs-fixer"]
file_patterns = ["php/**"]

# The PHPStan fixtures hold deliberately old or malformed lockfiles to exercise
# Laravel version detection; they are never installed.
[[exclude]]
plugins = ["osv-scanner", "trivy"]
file_patterns = ["SineMaculaLaravel/Tests/PHPStan/data/**"]
