name: Release

on:
    push:
        branches: [ master ]

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: write
    pull-requests: write

jobs:
    release:
        uses: sinemacula/.github/.github/workflows/release.yml@v3.1.0
        secrets: inherit
        with:
            use-app-token: true
