name: Tests

on:
    push:
        branches: [ master ]
    pull_request:
        types: [ opened, synchronize, reopened, ready_for_review ]
    workflow_dispatch:

concurrency:
    group: tests-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    id-token: write

defaults:
    run:
        shell: bash

jobs:
    tests:
        name: Test / PHP ${{ matrix.php }}
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: [ 8.3, 8.4, 8.5 ]

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            # pcov does not instrument sniffs loaded by php_codesniffer's autoloader.
            -   name: Setup PHP
                uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
                with:
                    php-version: ${{ matrix.php }}
                    coverage: xdebug
                    tools: composer

            -   name: Install dependencies
                run: composer install --prefer-dist --no-interaction --no-progress

            # Newer PHP asks for attributes, such as #[\Override] on a property, that 8.3 cannot parse.
            -   name: PHPStan
                if: ${{ matrix.php == '8.3' }}
                run: composer analyse

            -   name: PHPUnit
                run: composer test:coverage

            -   name: Publish code coverage
                if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && matrix.php == '8.3' }}
                uses: qltysh/qlty-action/coverage@0ff2178667bf8eb28ed0013a7ef54857a24d4056 # v2
                with:
                    oidc: true
                    files: clover.xml

    laravel:
        name: Test / Laravel ${{ matrix.laravel.label }}
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                laravel:
                    -   constraint: ^12.0
                        label: 12
                    -   constraint: ^13.0
                        label: 13

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Setup PHP
                uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
                with:
                    php-version: 8.3
                    tools: composer

            -   name: Pin Laravel version
                env:
                    LARAVEL_CONSTRAINT: ${{ matrix.laravel.constraint }}
                run: composer update --with="laravel/framework:${LARAVEL_CONSTRAINT}" --prefer-dist --no-interaction --no-progress

            -   name: PHPUnit
                run: composer test
