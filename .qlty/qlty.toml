# Reference: https://qlty.sh/d/qlty-toml
config_version = "0"

exclude_patterns = [
    "*_min.*",
    "*-min.*",
    "*.min.*",
    "**/build/**",
    "**/cache/**",
    "**/coverage/**",
    "**/dist/**",
    "**/node_modules/**",
    "**/vendor/**",
    ".claude/**",
    ".qlty/configs/**",
    ".sinemacula/**",
    "SineMaculaLaravel/Tests/**/*.inc",
]

test_patterns = [
    "**/test/**",
    "**/spec/**",
    # The PascalCase test layout is not matched by the default lowercase patterns.
    "**/Tests/**",
    "**/*Test.php",
    "**/*.test.*",
    "**/*.spec.*",
    "**/*_test.*",
    "**/*_spec.*",
    "**/test_*.*",
    "**/spec_*.*",
]

[[source]]
name = "default"
default = true

[[source]]
name = "sinemacula"
repository = "https://github.com/sinemacula/coding-standards"
tag = "v1.31.2"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "php-codesniffer"
package_file = "composer.json"
package_filters = ["slevomat", "dealerdirect", "sinemacula"]

# Setting package_file makes qlty ignore extra_packages.
[[plugin]]
name = "php-cs-fixer"
extra_packages = ["sinemacula/coding-standards@1.31.2"]

# Runs in CI instead: qlty Cloud never installs the vendor the rules depend on.
[[plugin]]
name = "phpstan"
mode = "disabled"

# php/ holds shipped tool configs, not source.
[[exclude]]
plugins = ["php-codesniffer", "php-cs-fixer"]
file_patterns = ["php/**"]

# Deliberately old or malformed fixture lockfiles, never installed.
[[exclude]]
plugins = ["osv-scanner", "trivy"]
file_patterns = ["SineMaculaLaravel/Tests/PHPStan/data/**"]
